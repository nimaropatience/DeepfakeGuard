version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/deepfakeguard.db:/app/deepfakeguard.db
    environment:
      - MODEL_DIR=/app/models
      - MAX_UPLOAD_MB=200
      - FRAMES_PER_VIDEO=16
      - DEFAULT_THRESHOLD=0.5
      - DATABASE_URL=sqlite:///deepfakeguard.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
